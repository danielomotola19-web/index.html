      @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

      :root {
        --ink: #14110F; --surface: #1E1A16; --surface-2: #262019; --hairline: #3A332A;
        --gold: #C8932B; --verdigris: #3F7A68; --clay: #B0492E;
        --text: #EDE6DA; --text-muted: #9C9389;
      }
      * { box-sizing: border-box; }
      .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--ink); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; position: relative; padding-bottom: 92px; }
      .loading-screen { display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; font-size: 13px; }

      .topbar { display: flex; align-items: center; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--hairline); }
      .topbar-title { flex: 1; min-width: 0; }
      .topbar-mark { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--gold); color: var(--gold); display: flex; align-items: center; justify-content: center; font-family: 'Roboto Slab', serif; font-weight: 700; font-size: 13px; flex-shrink: 0; }
      .topbar-brand { font-family: 'Roboto Slab', serif; font-weight: 700; font-size: 16px; letter-spacing: 0.01em; }
      .topbar-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

      .screen { padding: 18px 18px 8px; }
      .greeting { font-family: 'Roboto Slab', serif; font-weight: 700; font-size: 22px; margin: 4px 0 16px; }

      .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
      .stat-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 12px 14px; }
      .stat-value { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 19px; color: var(--gold); }
      .stat-label { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }

      .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
      .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .card-header h3, .card-header h4 { font-family: 'Roboto Slab', serif; font-size: 14.5px; font-weight: 600; margin: 0; }
      .link-btn { background: none; border: none; color: var(--gold); font-size: 12.5px; font-weight: 500; cursor: pointer; padding: 4px; }

      .attn-list { display: flex; flex-direction: column; gap: 4px; }
      .attn-row { display: flex; align-items: center; gap: 9px; background: none; border: none; width: 100%; text-align: left; padding: 8px 4px; border-radius: 8px; cursor: pointer; color: var(--text); }
      .attn-row:active { background: var(--surface-2); }
      .attn-text { flex: 1; font-size: 13px; }
      .attn-meta { font-size: 11px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }

      .empty-state { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px 20px; color: var(--text-muted); text-align: center; font-size: 13px; }

      .chip-row { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
      .chip { flex-shrink: 0; background: var(--surface); border: 1px solid var(--hairline); color: var(--text-muted); font-size: 12.5px; padding: 7px 13px; border-radius: 99px; cursor: pointer; }
      .chip-on { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 600; }

      .list { display: flex; flex-direction: column; gap: 10px; }

      .deal-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; padding: 14px 15px; text-align: left; cursor: pointer; display: block; width: 100%; }
      .deal-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
      .deal-title { font-family: 'Roboto Slab', serif; font-weight: 600; font-size: 14.5px; }
      .deal-card-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
      .deal-card-value { font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; color: var(--gold); margin-bottom: 4px; }
      .deal-card-commission { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--verdigris); margin-bottom: 9px; }
      .deal-card-dd { font-size: 10.5px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; margin-top: 6px; }

      .dd-list { display: flex; flex-direction: column; gap: 10px; }
      .dd-row { display: flex; align-items: center; gap: 10px; background: none; border: none; text-align: left; padding: 2px 0; cursor: pointer; width: 100%; }
      .dd-check { width: 19px; height: 19px; border-radius: 5px; border: 1.5px solid var(--hairline); flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--ink); }
      .dd-check-on { background: var(--verdigris); border-color: var(--verdigris); color: var(--ink); }
      .dd-label { font-size: 13px; color: var(--text); line-height: 1.35; }
      .dd-label-done { color: var(--text-muted); text-decoration: line-through; }
      .deal-commission-full { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--verdigris); }
      .deal-value-full { font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: var(--gold); }

      .badge { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; color: var(--badge-color); border: 1px solid var(--badge-color); background: color-mix(in srgb, var(--badge-color) 14%, transparent); flex-shrink: 0; }
      .badge-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }

      .stamp-mini-wrap { display: flex; flex-direction: column; gap: 4px; }
      .stamp-mini-track { height: 4px; background: var(--hairline); border-radius: 99px; overflow: hidden; }
      .stamp-mini-fill { height: 100%; background: var(--gold); border-radius: 99px; }
      .stamp-mini-label { font-size: 10.5px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
      .deal-stale-flag { font-size: 10.5px; color: var(--clay); font-family: 'IBM Plex Mono', monospace; margin-top: 6px; }

      .funnel { display: flex; flex-direction: column; gap: 9px; }
      .funnel-row { display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 2px 0; cursor: pointer; width: 100%; }
      .funnel-label { width: 92px; flex-shrink: 0; font-size: 10.5px; color: var(--text-muted); text-align: left; line-height: 1.25; }
      .funnel-track { flex: 1; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
      .funnel-fill { display: block; height: 100%; border-radius: 99px; min-width: 3px; }
      .funnel-count { width: 20px; flex-shrink: 0; text-align: right; font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: var(--text); }

      .goal-row { display: flex; flex-direction: column; gap: 6px; }
      .goal-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .goal-label { font-size: 12px; color: var(--text); }
      .goal-count { font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: var(--text-muted); flex-shrink: 0; }

      .search-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 9px 12px; margin-bottom: 12px; }
      .search-row input { background: none; border: none; outline: none; color: var(--text); font-size: 13.5px; width: 100%; }
      .import-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px dashed var(--hairline); color: var(--text-muted); font-size: 12px; padding: 7px 12px; border-radius: 8px; margin-bottom: 14px; cursor: pointer; }

      .contact-card { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 11px 13px; cursor: pointer; text-align: left; width: 100%; }
      .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--gold); color: var(--gold); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; flex-shrink: 0; }
      .avatar-sm { width: 28px; height: 28px; font-size: 11px; }
      .contact-info { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .contact-name-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
      .contact-name { font-size: 13.5px; font-weight: 500; }
      .contact-meta { font-size: 11.5px; color: var(--text-muted); }
      .contact-card-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
      .quick-log-btn { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--hairline); color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
      .quick-log-btn:active { background: var(--gold); border-color: var(--gold); color: var(--ink); transform: scale(0.95); }
      .stale-flag { font-size: 10.5px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
      .stale-urgent { color: var(--clay); }

      .fab-zone { position: fixed; bottom: 88px; right: 50%; transform: translateX(176px); z-index: 30; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
      .fab { width: 54px; height: 54px; border-radius: 50%; background: var(--gold); color: var(--ink); border: none; box-shadow: 0 4px 14px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; }
      .fab:active { transform: scale(0.95); }
      .fab-menu { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 6px; }
      .fab-menu button { background: none; border: none; color: var(--text); font-size: 13px; padding: 9px 14px; text-align: right; cursor: pointer; border-radius: 8px; white-space: nowrap; }
      .fab-menu button:active { background: var(--surface-2); }

      .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--hairline); display: flex; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); z-index: 20; }
      .bottom-nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--text-muted); font-size: 10.5px; padding: 6px 0; cursor: pointer; }
      .bottom-nav .nav-on { color: var(--gold); }

      .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; z-index: 50; }
