        --muted:   #7A7068;
        --hair:    #EDE8E1;
        --surface: #FFFFFF;
        --surface2:#F5F1EB;
        --success: #2D6B5A;
        --clay:    #B0492E;
        --shadow:  0 2px 12px rgba(0,0,0,0.07);
        --font-serif: Georgia,'Times New Roman',serif;
        --font-sans:  -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;
        --font-mono:  'Menlo','Monaco','Courier New',monospace;
      }
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
      html,body{margin:0;padding:0;background:var(--ivory);}
      input,select,textarea,button{font-family:var(--font-sans);}

      .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--ivory);color:var(--ink);font-family:var(--font-sans);padding-bottom:96px;}

      .loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
      .ra-mark{width:56px;height:56px;border-radius:50%;border:2px solid var(--crimson);color:var(--crimson);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:700;font-size:18px;}
      .loading-text{font-size:13px;color:var(--muted);}

      /* TOP BAR */
      .topbar{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;background:var(--white);border-bottom:1px solid var(--hair);box-shadow:0 1px 6px rgba(0,0,0,0.04);}
      .topbar-mark{width:38px;height:38px;border-radius:50%;border:2px solid var(--crimson);color:var(--crimson);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:700;font-size:13px;flex-shrink:0;}
      .topbar-title{flex:1;min-width:0;}
      .topbar-brand{font-family:var(--font-serif);font-weight:700;font-size:16px;color:var(--crimson);}
      .topbar-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}

      /* SCREEN */
      .screen{padding:18px 18px 8px;}
      .greeting{font-family:var(--font-serif);font-weight:700;font-size:22px;margin:4px 0 18px;color:var(--ink);}

      /* STATS */
      .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
      .stat-card{background:var(--white);border:1px solid var(--hair);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);}
      .stat-value{font-family:var(--font-mono);font-size:20px;font-weight:500;color:var(--crimson);}
      .stat-label{font-size:11.5px;color:var(--muted);margin-top:3px;}

      /* CARDS */
      .card{background:var(--white);border:1px solid var(--hair);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
      .card-alert{border-color:rgba(155,27,48,0.2);}
      .card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
      .card-hdr h3,.card-hdr h4{font-family:var(--font-serif);font-size:14.5px;font-weight:700;margin:0;color:var(--ink);}
      .badge-count{background:var(--crimson);color:#fff;border-radius:99px;font-size:11px;font-weight:600;padding:2px 8px;}
      .link-btn{background:none;border:none;color:var(--crimson);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px;}

      /* COMMISSION */
      .commission-grid{display:flex;align-items:center;gap:12px;}
      .commission-grid>div{flex:1;text-align:center;}
      .comm-divider{width:1px;height:36px;background:var(--hair);flex-shrink:0;}
      .comm-label{font-size:11px;color:var(--muted);margin-bottom:3px;}
      .comm-value{font-family:var(--font-mono);font-size:17px;color:var(--gold);font-weight:500;}
      .comm-earned{color:var(--success);}

      /* FUNNEL */
      .funnel{display:flex;flex-direction:column;gap:9px;}
      .funnel-row{display:flex;align-items:center;gap:10px;background:none;border:none;padding:2px 0;cursor:pointer;width:100%;}
      .funnel-label{width:108px;flex-shrink:0;font-size:11px;color:var(--muted);text-align:left;line-height:1.3;}
      .funnel-track{flex:1;}
      .funnel-count{width:22px;flex-shrink:0;text-align:right;font-size:12px;font-family:var(--font-mono);color:var(--ink);}

      /* GOAL BARS */
      .goal-row{display:flex;flex-direction:column;gap:6px;}
      .goal-top{display:flex;align-items:center;justify-content:space-between;}
      .goal-label{font-size:12.5px;color:var(--ink);}
      .goal-count{font-size:12px;font-family:var(--font-mono);color:var(--muted);}

      /* SHARED BAR */
      .bar-track{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden;}
      .bar-fill{height:100%;border-radius:99px;transition:width 0.3s ease;}

      /* ATTENTION ROWS */
      .attn-list{display:flex;flex-direction:column;gap:3px;}
      .attn-row{display:flex;align-items:center;gap:9px;background:none;border:none;width:100%;text-align:left;padding:9px 4px;border-radius:8px;cursor:pointer;color:var(--ink);}
      .attn-row:active{background:var(--surface2);}
      .attn-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
      .attn-icon svg{opacity:0.9;}
      .attn-red{background:rgba(155,27,48,0.08);}
      .attn-gold{background:rgba(184,151,90,0.12);}
      .attn-text{flex:1;font-size:13px;}
      .attn-meta{font-size:11px;color:var(--muted);font-family:var(--font-mono);}

      /* CHIPS */
      .chip-row{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
      .chip{flex-shrink:0;background:var(--white);border:1px solid var(--hair);color:var(--muted);font-size:12px;padding:7px 14px;border-radius:99px;cursor:pointer;}
      .chip-on{background:var(--crimson);border-color:var(--crimson);color:#fff;font-weight:600;}

      /* DEAL CARD */
      .list{display:flex;flex-direction:column;gap:10px;}
      .deal-card{background:var(--white);border:1px solid var(--hair);border-radius:14px;padding:14px 15px;text-align:left;cursor:pointer;display:block;width:100%;box-shadow:var(--shadow);}
      .deal-card:active{transform:scale(0.99);}
      .deal-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px;}
      .deal-title{font-family:var(--font-serif);font-weight:700;font-size:14px;color:var(--ink);}
      .deal-card-sub{font-size:12px;color:var(--muted);margin-bottom:5px;}
      .deal-card-value{font-family:var(--font-mono);font-size:14px;color:var(--crimson);font-weight:500;margin-bottom:4px;}
      .deal-card-comm{font-family:var(--font-mono);font-size:11px;color:var(--success);margin-bottom:9px;}
      .deal-dd-flag{font-size:10.5px;color:var(--muted);font-family:var(--font-mono);margin-top:5px;}
      .deal-stale-flag{font-size:10.5px;color:var(--clay);font-family:var(--font-mono);margin-top:4px;}

      /* STAMP BAR */
      .stamp-mini{display:flex;flex-direction:column;gap:4px;}
      .stamp-mini-label{font-size:10.5px;color:var(--muted);font-family:var(--font-mono);}

      /* CONTACT CARD */
      .contact-card{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--hair);border-radius:12px;padding:12px 13px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow);}
      .contact-card:active{transform:scale(0.99);}
      .avatar{width:40px;height:40px;border-radius:50%;background:var(--surface2);border:2px solid var(--crimson);color:var(--crimson);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:13px;font-weight:600;flex-shrink:0;}
      .avatar-sm{width:28px;height:28px;font-size:11px;}
      .contact-info{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
      .contact-name-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
      .contact-name{font-size:13.5px;font-weight:600;color:var(--ink);}
      .contact-meta{font-size:11.5px;color:var(--muted);}
      .stale-flag{font-size:10.5px;color:var(--muted);font-family:var(--font-mono);}
      .stale-urgent{color:var(--clay);}
      .contact-card-actions{display:flex;align-items:center;gap:5px;flex-shrink:0;}
      .ql-btn{width:30px;height:30px;border-radius:50%;background:var(--surface2);border:1px solid var(--hair);color:var(--crimson);display:flex;align-items:center;justify-content:center;cursor:pointer;}
      .ql-btn:active{background:var(--crimson);color:#fff;transform:scale(0.93);}

      /* SEARCH */
      .search-row{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--hair);border-radius:10px;padding:9px 12px;margin-bottom:12px;box-shadow:var(--shadow);}
      .search-row input{background:none;border:none;outline:none;color:var(--ink);font-size:13.5px;width:100%;}
      .import-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px dashed var(--hair);color:var(--muted);font-size:12px;padding:7px 12px;border-radius:8px;margin-bottom:14px;cursor:pointer;}

      /* AI SCREEN */
      .ai-screen{display:flex;flex-direction:column;height:calc(100vh - 96px - 64px);padding:0;}
      .ai-header{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--hair);background:var(--white);}
      .ai-title{font-family:var(--font-serif);font-weight:700;font-size:16px;color:var(--crimson);}
      .ai-sub{font-size:11px;color:var(--muted);}
      .ai-no-key{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 24px;text-align:center;}
      .ai-no-key h3{font-family:var(--font-serif);font-size:20px;font-weight:700;margin:0;color:var(--crimson);}
      .ai-no-key p{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0;}
      .ai-messages{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
      .ai-welcome{text-align:center;padding:24px 0;}
      .ai-welcome-icon{margin-bottom:12px;}
      .ai-welcome p{font-size:13.5px;color:var(--muted);margin:0 0 14px;}
      .ai-suggestions{display:flex;flex-direction:column;gap:7px;}
      .ai-suggestion{background:var(--white);border:1px solid var(--hair);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--crimson);cursor:pointer;text-align:left;}
      .ai-suggestion:active{background:var(--surface2);}
      .ai-msg{display:flex;flex-direction:column;gap:4px;}
      .ai-msg-user{align-items:flex-end;}
      .ai-msg-assistant{align-items:flex-start;}
      .ai-bubble{max-width:85%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.5;}
      .ai-msg-user .ai-bubble{background:var(--crimson);color:#fff;border-radius:14px 14px 4px 14px;}
      .ai-msg-assistant .ai-bubble{background:var(--white);color:var(--ink);border:1px solid var(--hair);border-radius:14px 14px 14px 4px;box-shadow:var(--shadow);}
      .ai-thinking{display:flex;gap:5px;align-items:center;min-width:48px;}
      .ai-thinking span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pulse 1.2s ease-in-out infinite;}
      .ai-thinking span:nth-child(2){animation-delay:0.2s;}
      .ai-thinking span:nth-child(3){animation-delay:0.4s;}
      @keyframes pulse{0%,80%,100%{opacity:0.3;}40%{opacity:1;}}
      .ai-actions-done{display:flex;flex-direction:column;gap:3px;margin-top:4px;}
      .ai-action-tag{font-size:10.5px;color:var(--success);font-family:var(--font-mono);}
      .ai-input-row{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--white);border-top:1px solid var(--hair);}
      .ai-mic-btn{width:36px;height:36px;border-radius:50%;background:rgba(155,27,48,0.08);border:1px solid rgba(155,27,48,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
      .ai-mic-on{background:var(--crimson)!important;border-color:var(--crimson)!important;}
      .ai-input{flex:1;border:1px solid var(--hair);border-radius:20px;padding:9px 14px;font-size:13.5px;background:var(--surface2);color:var(--ink);outline:none;}
      .ai-input:focus{border-color:var(--crimson);}
      .ai-send-btn{width:36px;height:36px;border-radius:50%;background:var(--crimson);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
      .ai-send-btn:disabled{opacity:0.4;cursor:not-allowed;}
      .ai-key-info{background:var(--surface2);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
      .ai-key-info p{font-size:13px;color:var(--muted);margin:0;line-height:1.5;}

      /* FAB */
      .fab-zone{position:fixed;bottom:92px;right:50%;transform:translateX(176px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
      .fab{width:54px;height:54px;border-radius:50%;background:var(--crimson);color:#fff;border:none;box-shadow:0 4px 16px rgba(155,27,48,0.4);display:flex;align-items:center;justify-content:center;cursor:pointer;}
      .fab:active{transform:scale(0.95);}
      .fab-menu{display:flex;flex-direction:column;gap:6px;background:var(--white);border:1px solid var(--hair);border-radius:12px;padding:6px;box-shadow:0 4px 20px rgba(0,0,0,0.12);}
      .fab-menu button{background:none;border:none;color:var(--ink);font-size:13px;padding:9px 14px;text-align:right;cursor:pointer;border-radius:8px;white-space:nowrap;}
      .fab-menu button:active{background:var(--surface2);}

      /* BOTTOM NAV */
      .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--white);border-top:1px solid var(--hair);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -2px 12px rgba(0,0,0,0.06);}
      .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);font-size:9.5px;padding:5px 0;cursor:pointer;}
      .bottom-nav .nav-on{color:var(--crimson);}

      /* OVERLAY / SHEET */
      .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-end;z-index:50;}
      .sheet{background:var(--ivory);border-top:1px solid var(--hair);border-radius:20px 20px 0 0;width:100%;max-width:480px;margin:0 auto;max-height:90vh;overflow-y:auto;padding:10px 20px calc(28px + env(safe-area-inset-bottom));animation:slideUp 0.22s ease-out;}
      @keyframes slideUp{from{transform:translateY(24px);opacity:0.7;}to{transform:translateY(0);opacity:1;}}
      .sheet-handle{width:36px;height:4px;border-radius:99px;background:var(--hair);margin:4px auto 14px;}
      .sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
      .sheet-header h2{font-family:var(--font-serif);font-size:18px;font-weight:700;margin:0;color:var(--ink);}
      .icon-btn{background:var(--surface2);border:1px solid var(--hair);color:var(--ink);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;}

      /* FORM FIELDS */
      .section-title{font-size:11px;font-weight:700;color:var(--crimson);text-transform:uppercase;letter-spacing:0.07em;margin:20px 0 10px;}
      .section-title:first-child{margin-top:0;}
      .field{display:block;margin-bottom:14px;}
      .field-label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:500;}
      .field-hint{display:block;font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.4;}
      .field-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
      input,select,textarea{width:100%;background:var(--white);border:1.5px solid var(--hair);color:var(--ink);border-radius:9px;padding:10px 12px;font-size:13.5px;outline:none;}
      input:focus,select:focus,textarea:focus{border-color:var(--crimson);}
      textarea{resize:vertical;}

      /* BUTTONS */
      .btn-primary{width:100%;background:var(--crimson);color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;}
      .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
      .btn-primary:active:not(:disabled){transform:scale(0.98);}
      .btn-primary-sm{background:var(--crimson);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;}
      .btn-ghost-sm,.btn-danger-sm{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;}
      .btn-ghost-sm{background:var(--surface2);border:1px solid var(--hair);color:var(--ink);}
      .btn-danger-sm{background:none;border:1px solid var(--clay);color:var(--clay);}
      .detail-actions{display:flex;gap:8px;margin-bottom:14px;}
      .flex-gap{display:flex;gap:8px;}
      .flex-end{display:flex;justify-content:flex-end;gap:8px;}

      /* BADGES */
      .badge{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;color:var(--bc);border:1px solid var(--bc);background:color-mix(in srgb,var(--bc) 10%,transparent);flex-shrink:0;}
      .badge-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px;}

      /* STATUS PILLS */
      .status-row{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
      .status-pill{font-size:11px;font-weight:600;padding:7px 11px;border-radius:99px;background:none;border:1px solid var(--hair);color:var(--muted);cursor:pointer;}
      .status-pill-on{color:var(--bc);border-color:var(--bc);background:color-mix(in srgb,var(--bc) 12%,transparent);}

      /* STEPPER */
      .stepper{display:flex;flex-direction:column;}
      .stepper-row{display:flex;align-items:center;gap:12px;background:none;border:none;padding:7px 2px;cursor:pointer;text-align:left;position:relative;}
      .stepper-row::before{content:'';position:absolute;left:13px;top:-2px;bottom:-2px;width:1.5px;background:var(--hair);z-index:0;}
      .stepper-row:first-child::before{top:50%;}
      .stepper-row:last-child::before{bottom:50%;}
      .stamp{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;border:1.5px solid var(--hair);color:var(--muted);background:var(--white);flex-shrink:0;z-index:1;}
      .stamp-done{background:var(--crimson);border-color:var(--crimson);color:#fff;}
      .stamp-current{border-color:var(--crimson);color:var(--crimson);box-shadow:0 0 0 3px rgba(155,27,48,0.12);}
      .stepper-text{font-size:13px;color:var(--ink);}
      .stepper-pending .stepper-text{color:var(--muted);}

      /* ACTIVITY */
      .touch-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;margin:12px 0;}
      .touch-label{font-size:10.5px;color:var(--muted);}
      .touch-value{font-size:13px;font-family:var(--font-mono);margin-top:2px;color:var(--ink);}
      .activity-form{background:var(--surface2);border:1px solid var(--hair);border-radius:10px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;}
      .voice-row{display:flex;gap:8px;align-items:flex-start;}
      .voice-btn{width:38px;height:38px;border-radius:50%;background:rgba(155,27,48,0.08);border:1px solid rgba(155,27,48,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-top:2px;}
      .voice-on{background:var(--crimson)!important;}

      /* TIMELINE */
      .timeline{display:flex;flex-direction:column;gap:2px;}
      .timeline-row{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-bottom:1px solid var(--hair);}
      .timeline-row:last-child{border-bottom:none;}
      .tl-icon{width:26px;height:26px;border-radius:50%;background:rgba(155,27,48,0.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
      .tl-body{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
      .tl-top{display:flex;align-items:center;gap:8px;}
      .tl-type{font-size:12.5px;font-weight:600;color:var(--ink);}
      .tl-date{font-size:10.5px;color:var(--muted);font-family:var(--font-mono);}
      .tl-text{font-size:12.5px;color:var(--muted);line-height:1.4;}
      .icon-btn-xs{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;flex-shrink:0;}

      /* PROFILE GRID */
      .profile-grid{display:flex;flex-direction:column;gap:7px;background:var(--surface2);border:1px solid var(--hair);border-radius:10px;padding:12px;margin:12px 0 14px;}
      .profile-grid>div{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;}
      .pk{color:var(--muted);flex-shrink:0;}

      /* MISC */
      .notes-block{font-size:13px;line-height:1.55;color:var(--ink);background:var(--surface2);border-radius:10px;padding:12px;margin:0 0 14px;white-space:pre-wrap;}
      .sub-section{margin-top:18px;}
      .sub-section h4{font-family:var(--font-serif);font-size:13.5px;margin:0 0 8px;color:var(--ink);}
      .mini-row{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--white);border:1px solid var(--hair);border-radius:9px;padding:10px 12px;width:100%;margin-bottom:6px;cursor:pointer;color:var(--ink);font-size:13px;text-align:left;}
      .mini-row.done{color:var(--muted);text-decoration:line-through;}
      .mini-row-side{display:flex;align-items:center;gap:6px;flex-shrink:0;}
      .import-row{gap:10px;cursor:pointer;}
      .import-row input{width:auto;}
      .confirm-row{display:flex;align-items:center;justify-content:space-between;background:rgba(155,27,48,0.06);border:1px solid rgba(155,27,48,0.2);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;gap:10px;}
      .empty-state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 20px;color:var(--muted);text-align:center;font-size:13px;}

      /* DEAL DETAIL */
      .deal-meta-grid{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin-bottom:14px;}
      .deal-meta-grid>div{display:flex;align-items:center;gap:6px;}
      .deal-value-full{font-family:var(--font-mono);font-size:16px;color:var(--crimson);font-weight:500;}
      .deal-comm-full{font-family:var(--font-mono);font-size:12.5px;color:var(--success);}

      /* DUE DILIGENCE */
      .dd-list{display:flex;flex-direction:column;gap:10px;}
      .dd-row{display:flex;align-items:center;gap:10px;background:none;border:none;text-align:left;padding:2px 0;cursor:pointer;width:100%;}
      .dd-check{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--hair);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--white);}
      .dd-check-on{background:var(--crimson);border-color:var(--crimson);color:#fff;}
      .dd-label{font-size:13px;color:var(--ink);line-height:1.35;}
      .dd-done{color:var(--muted);text-decoration:line-through;}

      /* WA TOGGLE */
      .contact-links{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
      .contact-links a{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-size:13.5px;font-family:var(--font-mono);}
      .wa-toggle{display:flex;align-items:center;gap:8px;color:var(--success);background:none;border:none;font-size:13.5px;font-family:var(--font-mono);cursor:pointer;padding:0;}

      .hint-text{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:12px;}

      .sync-status-on{display:flex;gap:12px;align-items:flex-start;background:rgba(45,107,90,0.08);border:1px solid rgba(45,107,90,0.25);border-radius:12px;padding:14px;margin-bottom:14px;}
      .sync-on-title{font-weight:700;font-size:14px;color:var(--success);}
      .sync-on-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
      .sync-steps{font-size:12.5px;color:var(--ink);line-height:1.7;padding-left:18px;margin:0 0 12px;}
      .sync-steps li{margin-bottom:6px;}
      .sync-rules{background:var(--ink);color:#E8E2D8;font-family:var(--font-mono);font-size:10px;line-height:1.55;border-radius:10px;padding:12px;white-space:pre;overflow-x:auto;margin-bottom:14px;}
      /* GOAL CARD */
      .goal-card{width:100%;text-align:left;cursor:pointer;border:1.5px solid rgba(184,151,90,0.4);}
      .goal-pct{font-family:var(--font-mono);font-size:13px;color:var(--gold);font-weight:600;}
      .goal-big-row{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
      .goal-big{font-family:var(--font-mono);font-size:24px;color:var(--gold);font-weight:600;}
      .goal-of{font-size:12px;color:var(--muted);}
      .goal-track{height:9px;margin-bottom:8px;}
      .goal-sub-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}

      /* PRIORITY */
      .priority-card{border:1.5px solid rgba(155,27,48,0.25);}
      .priority-hint{font-size:10px;color:var(--muted);}
      .priority-row{display:flex;align-items:center;gap:8px;}
      .priority-main{display:flex;align-items:center;gap:10px;flex:1;background:none;border:none;padding:8px 2px;cursor:pointer;text-align:left;min-width:0;}
      .priority-info{display:flex;flex-direction:column;gap:1px;min-width:0;}
      .priority-name{font-size:13.5px;font-weight:600;color:var(--ink);}
      .priority-reason{font-size:11px;color:var(--crimson);font-family:var(--font-mono);}

      /* OUTCOMES / OBJECTIONS / REFERRALS */
      .tl-outcome{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px;color:var(--oc);border:1px solid var(--oc);}
      .objections-block,.referral-block{font-size:12.5px;line-height:1.5;border-radius:10px;padding:11px 12px;margin:0 0 12px;}
      .objections-block{background:rgba(176,73,46,0.06);border:1px solid rgba(176,73,46,0.25);color:var(--ink);}
      .referral-block{background:rgba(184,151,90,0.08);border:1px solid rgba(184,151,90,0.3);color:var(--ink);}
      .objections-label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:4px;}

      /* ANALYTICS */
      .an-goal{background:var(--surface2);border:1px solid var(--hair);border-radius:12px;padding:14px;margin-bottom:6px;}
      .an-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
      .an-stats-grid>div{display:flex;flex-direction:column;gap:2px;}
      .an-k{font-size:10.5px;color:var(--muted);}
      .an-v{font-family:var(--font-mono);font-size:14px;color:var(--ink);font-weight:500;}
      .an-funnel-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 2px;border-bottom:1px solid var(--hair);}
      .an-funnel-row:last-child{border-bottom:none;}
      .an-bar-row{display:flex;align-items:center;gap:10px;padding:5px 0;}
      .an-bar-label{width:96px;flex-shrink:0;font-size:11.5px;color:var(--muted);}
      .an-bar-count{width:20px;text-align:right;font-family:var(--font-mono);font-size:12px;}

      .sync-error{background:rgba(176,73,46,0.08);border:1px solid rgba(176,73,46,0.3);color:var(--clay);font-size:12.5px;border-radius:9px;padding:10px 12px;margin-bottom:10px;}

      /* BACKUP */
      .backup-stats{display:flex;gap:14px;justify-content:space-around;background:var(--surface2);border:1px solid var(--hair);border-radius:10px;padding:14px;margin-bottom:14px;font-size:12.5px;color:var(--muted);}
      .backup-stats strong{display:block;font-family:var(--font-mono);font-size:18px;color:var(--crimson);font-weight:500;margin-bottom:2px;text-align:center;}
      .backup-stats span{text-align:center;flex:1;}
      .csv-buttons{display:flex;gap:8px;}
      .csv-buttons button{flex:1;justify-content:center;}
